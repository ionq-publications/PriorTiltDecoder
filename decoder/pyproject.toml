# Python package of the Rust core: `pip install ./decoder` (needs a Rust toolchain, https://rustup.rs) builds the
# extension module `priortilt_rs` with maturin and installs it into the active environment.
[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "priortilt_rs"
version = "1.0.0"
description = "PriorTilt decoder: Rust core with Python bindings"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[tool.maturin]
module-name = "priortilt_rs"
profile = "release"
