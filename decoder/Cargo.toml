[package]
name = "priortilt_rs"
version = "1.0.0"
edition = "2021"
description = "PriorTilt: min-sum BP with transient prior tilts for circuit-level decoding of quantum LDPC codes (Rust core with Python bindings)"
license = "CC-BY-NC-SA-4.0"
publish = false

[lib]
name = "priortilt_rs"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28", features = ["extension-module", "abi3-py310"] }
numpy = "0.28"
rand = "0.8.5"

[build-dependencies]
pyo3-build-config = "0.28"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
